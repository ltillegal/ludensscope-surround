name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name (vX.Y.Z)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows

    steps:
      - uses: actions/checkout@v7

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libfreetype6-dev \
            libfontconfig1-dev libgl1-mesa-dev libcurl4-openssl-dev

      - name: Version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ -n "${{ inputs.tag }}" ]]; then VERSION="${{ inputs.tag }}"; VERSION="${VERSION#v}"; fi
          echo "LUDENSCOPE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: |
          EXTRA=""
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            EXTRA="-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15"
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DLUDENSCOPE_VERSION="$LUDENSCOPE_VERSION" $EXTRA

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Package (Linux .deb)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          rm -rf pkgroot
          mkdir -p pkgroot/DEBIAN pkgroot/usr/lib/vst3 pkgroot/usr/lib/clap \
                   pkgroot/usr/bin pkgroot/usr/share/applications \
                   pkgroot/usr/share/icons/hicolor/256x256/apps
          cp -R "build/LudensScopeSurround_artefacts/Release/VST3/LudensScope Surround.vst3" pkgroot/usr/lib/vst3/
          cp -R "build/LudensScopeSurround_artefacts/Release/CLAP/LudensScope Surround.clap" pkgroot/usr/lib/clap/
          install -Dm755 "build/LudensScopeSurround_artefacts/Release/Standalone/LudensScope Surround" pkgroot/usr/bin/ludensscope-surround
          install -Dm644 Source/assets/ludens_logo.png pkgroot/usr/share/icons/hicolor/256x256/apps/ludensscope-surround.png
          cat > pkgroot/usr/share/applications/ludensscope-surround.desktop <<EOF
          [Desktop Entry]
          Name=LudensScope Surround
          Comment=Stereo and decoded 5.1 audio analyzer
          Exec=ludensscope-surround
          Icon=ludensscope-surround
          Terminal=false
          Type=Application
          Categories=AudioVideo;Audio;
          EOF
          cat > pkgroot/DEBIAN/control <<EOF
          Package: ludensscope-surround
          Version: ${LUDENSCOPE_VERSION}
          Section: sound
          Priority: optional
          Architecture: amd64
          Maintainer: ltillegal <alek.ludens@gmail.com>
          Depends: libasound2 | libasound2t64, libcurl4 | libcurl4t64, libfreetype6, libx11-6, libxext6, libxinerama1, libxrandr2, libxrender1, libgl1
          Description: Stereo and decoded 5.1 audio analyzer (VST3, CLAP, standalone)
           Spectrum, BS.1770 loudness, true peak, 5.1 room view, ORIG/REF reference,
           gain staging and VU.
          EOF
          dpkg-deb --build --root-owner-group pkgroot LudensScopeSurround-linux.deb

      - name: Package (macOS .pkg)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          for bundle in "build/LudensScopeSurround_artefacts/Release/VST3/LudensScope Surround.vst3" \
                        "build/LudensScopeSurround_artefacts/Release/AU/LudensScope Surround.component" \
                        "build/LudensScopeSurround_artefacts/Release/CLAP/LudensScope Surround.clap" \
                        "build/LudensScopeSurround_artefacts/Release/AAX/LudensScope Surround.aaxplugin" \
                        "build/LudensScopeSurround_artefacts/Release/Standalone/LudensScope Surround.app"; do
            if [ -e "$bundle" ]; then
              codesign --force --deep --sign - "$bundle"
            fi
          done
          rm -rf pkgroot
          mkdir -p pkgroot/Library/Audio/Plug-Ins/VST3 \
                   pkgroot/Library/Audio/Plug-Ins/Components \
                   pkgroot/Library/Audio/Plug-Ins/CLAP \
                   "pkgroot/Library/Application Support/Avid/Audio/Plug-Ins" \
                   pkgroot/Applications
          cp -R "build/LudensScopeSurround_artefacts/Release/VST3/LudensScope Surround.vst3" pkgroot/Library/Audio/Plug-Ins/VST3/
          cp -R "build/LudensScopeSurround_artefacts/Release/AU/LudensScope Surround.component" pkgroot/Library/Audio/Plug-Ins/Components/
          cp -R "build/LudensScopeSurround_artefacts/Release/CLAP/LudensScope Surround.clap" pkgroot/Library/Audio/Plug-Ins/CLAP/
          cp -R "build/LudensScopeSurround_artefacts/Release/AAX/LudensScope Surround.aaxplugin" "pkgroot/Library/Application Support/Avid/Audio/Plug-Ins/"
          cp -R "build/LudensScopeSurround_artefacts/Release/Standalone/LudensScope Surround.app" pkgroot/Applications/
          pkgbuild --root pkgroot --identifier com.ltillegal.ludensscopesurround \
                   --version "$LUDENSCOPE_VERSION" --install-location / LudensScopeSurround-macos.pkg

      - name: Package (Windows .exe)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $nsis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (!(Test-Path $nsis)) { $nsis = "C:\Program Files\NSIS\makensis.exe" }
          $script = @'
          !include "MUI2.nsh"
          Name "LudensScope Surround"
          OutFile "LudensScopeSurround-windows.exe"
          InstallDir "$COMMONFILES64\VST3"
          RequestExecutionLevel admin
          Unicode true
          !insertmacro MUI_PAGE_WELCOME
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_PAGE_FINISH
          !insertmacro MUI_LANGUAGE "English"
          Section "VST3" SecVst3
            SetOutPath "$INSTDIR"
            File /r "build\LudensScopeSurround_artefacts\Release\VST3\LudensScope Surround.vst3"
            WriteUninstaller "$INSTDIR\LudensScopeSurround-uninstall.exe"
          SectionEnd
          Section "CLAP" SecClap
            SetOutPath "$COMMONFILES64\CLAP"
            File /r "build\LudensScopeSurround_artefacts\Release\CLAP\LudensScope Surround.clap"
          SectionEnd
          Section "AAX (Pro Tools)" SecAax
            SetOutPath "$COMMONFILES64\Avid\Audio\Plug-Ins"
            File /r "build\LudensScopeSurround_artefacts\Release\AAX\LudensScope Surround.aaxplugin"
          SectionEnd
          Section "Standalone" SecStandalone
            SetOutPath "$PROGRAMFILES64\LudensScope Surround"
            File "build\LudensScopeSurround_artefacts\Release\Standalone\LudensScope Surround.exe"
            CreateShortcut "$SMPROGRAMS\LudensScope Surround.lnk" "$PROGRAMFILES64\LudensScope Surround\LudensScope Surround.exe"
          SectionEnd
          Section "Uninstall"
            Delete "$INSTDIR\LudensScopeSurround-uninstall.exe"
            RMDir /r "$INSTDIR\LudensScope Surround.vst3"
            Delete "$COMMONFILES64\CLAP\LudensScope Surround.clap"
            RMDir /r "$COMMONFILES64\Avid\Audio\Plug-Ins\LudensScope Surround.aaxplugin"
            RMDir /r "$PROGRAMFILES64\LudensScope Surround"
            Delete "$SMPROGRAMS\LudensScope Surround.lnk"
          SectionEnd
          '@
          Set-Content -Path installer.nsi -Value $script -Encoding UTF8
          & $nsis installer.nsi
          if (!(Test-Path LudensScopeSurround-windows.exe)) { exit 1 }

      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.name }}
          path: LudensScopeSurround-*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/*
